adapter_name: compiler_peephole
adapter_id: qspecbench.compiler.peephole.v1
adapter_version: 1.0.0
supported_evidence_types:
  - internal_denotation_consistency
required_files:
  - source_qasm
  - target_qasm
check_command: "python parse_result.py {path} {path2}"
success_condition: "compiler output bytes exactly equal target bytes"
failure_condition: "unsupported source syntax, compiler error, or target mismatch"
trust_level: independently_checkable
output_format: json
scope:
  supports:
    - compiler_transformation_reproduced
  does_not_support:
    - source_target_semantic_equivalence
