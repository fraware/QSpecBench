permissions:
  contents: read

name: Promotion check

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "schema/**"
      - "tools/qspecbench/**"
      - "lean/**"
      - "adapters/**"
      - "scripts/**"
      - "tests/**"

jobs:
  promotion-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          set -euo pipefail
          ELAN_VERSION=v4.2.3
          ELAN_SHA256=df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          curl -sSfL "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/elan.tar.gz
          echo "${ELAN_SHA256}  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-
      - name: Fetch Mathlib cache
        run: |
          cd lean
          lake exe cache get || true
      - name: Build Lean proofs
        run: |
          cd lean
          lake build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --extra dev
      - name: Export theorem elaborator types
        run: uv run python scripts/export_theorem_types.py > /dev/null
      - run: uv run qspecbench validate benchmarks/
      - run: git fetch origin "${{ github.base_ref }}"
      - run: uv run pytest tests/test_infrastructure_b.py tests/test_claim_diff.py tests/test_lean_evidence.py -q
      - name: Claim diff on changed benchmarks
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          base = os.environ.get("GITHUB_BASE_REF", "main")
          out = subprocess.check_output(
              ["git", "diff", "--name-only", f"origin/{base}...HEAD"],
              text=True,
          )
          for line in out.splitlines():
              if line.endswith("spec.yaml") and "benchmarks/" in line:
                  claim = Path(line).parent
                  print(f"=== claim-diff {claim} ===")
                  subprocess.run(["uv", "run", "qspecbench", "claim-diff", str(claim)], check=True)
          PY
