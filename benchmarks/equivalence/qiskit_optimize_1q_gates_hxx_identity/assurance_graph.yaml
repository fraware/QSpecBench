proposition:
  id: qiskit_optimize_1q_gates_hxx_identity_v1
  version: 1
  text: Under the QSpecBench OpenQASM fragment denotation, the committed H;X;X source
    and the target emitted by the named public compiler pass qiskit.transpiler.passes.Optimize1qGates
