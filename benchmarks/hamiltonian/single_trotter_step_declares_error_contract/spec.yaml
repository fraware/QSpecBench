headline_claim_status:
  status: checked
  notes: Analytic entry-modulus bound 1/5 at dt=0.1 discharged; Mathlib Euclidean
    ell^2 opNorm equality checked. Historical fidelity 1e-6 at artifact step is permanently
    not_applicable (proved-negative). Revised Taylor-proxy fidelity 1e-6 at dt=1/100
    is checked as a side obligation. Process-fidelity HS proxy beyond Taylor discharged
    (overlap identity + F=1 at t=0). AGF proxy (|⟨U,V⟩|²+2)/6 and diamond op-upper
    2‖U−V‖₂ ≤ 2√8 discharged (product_formula_agf_diamond_proxies_beyond_taylor).
    Haar AGF = Nielsen unitary formula; diamond op-proxy characterized at exactness;
    qubit unitary diamond closed form 2√(1−Fproc); Choi vec-outer and Choi Schatten-1
    pure-projector diamond (= finite-dim CB for U(2)) equal JW form. Qubit Choi
    carrier + purified diamond specializes to that CB (non-unitary Choi seeds admitted;
    Frobenius Schatten-1 upper proxy on general Choi pairs). Mathlib Hermitian
    eigenvalue Schatten-1 defined on Choi differences; exact diamond=2 for
    non-unitary replacement |0⟩ vs |1⟩. Qubit Pauli-channel class diamond ∑|Δp_σ|
    (extremes + depolarizing closed forms; specializes to true CB on Ad_X vs Ad_I).
    Orthogonal pure Choi diamond=2. Beyond-Pauli subclass checked
    (Kraus/unital/amplitude-damping + replacement diag-nuclear=2). General Mathlib
    CB for arbitrary CPTP permanently not_applicable (claim-identity v3 narrowing).
    Multi-step Trotter composition discharged under declared N=5 · entry-modulus
    triangle proxy (multi_step_trotter_composition_discharged); not an
    operator-norm / unbounded-N result. Haar Monte-Carlo integral discharged under
    a hashed numerical certificate (256 samples, seed 20260725) agreeing with the
    Nielsen closed form within declared tolerance, plus Lean-declared contract
    parameters; not a measure-theoretic proof of the integral. Maturity
    experimental_closed; not independently reviewed.
