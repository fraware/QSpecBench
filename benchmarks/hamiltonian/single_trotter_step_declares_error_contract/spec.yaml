proof_obligations:
- id: contract_declaration
  status: passing
  notes: Declared entry-modulus bound matches artifact
- id: entry_modulus_achievement
  status: passing
  notes: Discharged by single_trotter_step_entry_contract_discharged
- id: mathlib_spectral_opNorm_equality
  status: passing
  notes: Mathlib Euclidean ℓ² mathlibL2OpNorm equals toEuclideanLin CLM opNorm; product-formula
    difference satisfies ‖D‖₂ ≤ ‖D‖_F ≤ √8 for all t
- id: fidelity_achievement
  status: not_applicable
  notes: 'PERMANENT historical record: fidelity 1e-6 at dt=0.1 is proved-negative
    (historical_fidelity_1e6_at_artifact_step_permanently_false). Never restored as
    checked. See fidelity_taylor_proxy_at_revised_step.'
- id: fidelity_taylor_proxy_at_revised_step
  status: passing
  notes: 'Revised contract: Taylor Frobenius proxy at dt=1/100 ≤ 1e-6 (fidelity_taylor_proxy_at_revised_step_meets_1e6
    / taylor_product_analytic_error_bound).'
- id: process_fidelity_hs_proxy
  status: passing
  notes: 'Beyond Taylor: HS overlap identity product_formula_hs_overlap_re + processFidelityProxy
    at t=0 equals 1 (product_formula_process_fidelity_beyond_taylor_proxy). Not historical
    1e-6 at dt=0.1.'
- id: average_gate_fidelity_hs_proxy
  status: passing
  notes: AGF proxy (|⟨U,V⟩_HS|²+2)/6 = (2·processFidelity+1)/3; product_formula_average_gate_fidelity_proxy_at_zero
    (=1). Not Haar state AGF.
- id: diamond_norm_op_upper_proxy
  status: passing
  notes: diamondNormProxy = 2·mathlibL2OpNorm(U−V); =0 at t=0; ≤ 2√8 ∀t (product_formula_diamond_norm_proxy_le_two_sqrt_eight).
    Not true CB/Choi diamond.
- id: haar_average_gate_fidelity_unitary
  status: passing
  notes: Haar AGF = Nielsen unitary formula (|⟨U,V⟩_HS|²+2)/6; product_formula_haar_agf_and_diamond_characterization.
    Not Monte-Carlo Haar integral.
- id: diamond_norm_op_characterization
  status: passing
  notes: diamond op-upper proxy =0 at exactness (product_formula exact at t=0). Not
    Choi CB diamond.
- id: unitary_qubit_diamond_closed_form
  status: passing
  notes: 'Declared diamond metric for qubit unitaries: unitaryQubitDiamond = 2√(1−Fproc)
    = √(6(1−AGF)) (Johnston–Watrous d=2); =0 at product-formula t=0.'
- id: unitary_choi_diamond_characterization
  status: passing
  notes: 'Choi vec-outer diamond unitaryChoiDiamond = unitaryQubitDiamond via HS/vec
    alignment (product_formula_unitary_choi_diamond_characterization). Explicit
    choiUnitaryUnnorm |vec U⟩⟨vec U|.'
- id: unitary_choi_schatten1_diamond
  status: passing
  notes: 'Choi Schatten-1 pure-projector diamond unitaryChoiSchatten1Diamond =
    trueCbDiamondUnitaryQubit = unitaryQubitDiamond (product_formula_unitary_choi_schatten1_characterization).
    Finite-dim CB specialization for U(2); not a general Mathlib CB API on arbitrary CPTP maps.'
- id: qubit_pauli_channel_cb_class
  status: passing
  notes: 'Qubit Pauli-channel diamond ∑|Δp_σ|; extremes + depolarizing closed forms;
    specializes to trueCb on Ad_X vs Ad_I (qubit_pauli_channel_cb_class_beyond_unitary_replacement).
    Not arbitrary CPTP (permanently narrowed; see qubit_cptp_cb_proved_subclass_mathlib).'
- id: orthogonal_pure_choi_diamond
  status: passing
  notes: 'Orthogonal pure Choi projectors have purified Schatten-1 diamond = 2
    (orthogonal_pure_choi_diamond_eq_two).'
- id: qubit_cptp_cb_proved_subclass_mathlib
  status: passing
  notes: 'Beyond-Pauli proved subclass (Quantum.Channel): Kraus TP carrier, unital
    identity/depolarizing carriers, amplitude-damping non-Pauli extremes (γ=0 vs γ=1),
    Hermitian replacement Choi difference = diagonal(1,0,0,−1) with diagAbsSum nuclear=2
    (qubit_cptp_cb_proved_subclass_mathlib). Not arbitrary CPTP diamond.'
- id: general_cb_arbitrary_cptp_mathlib
  status: not_applicable
  notes: 'PERMANENT residual (claim-identity v3 narrowing): Mathlib v4.14 has no
    Schatten/CB API for arbitrary CPTP maps. Proved subclass is
    qubit_cptp_cb_proved_subclass_mathlib (unitary+replacement+Pauli+Kraus/unital/AD).
    Never checked as general CPTP; not a silent Pauli-only rename.'
- id: multi_step_trotter_composition
  status: passing
  notes: 'Discharged under declared step count N=5 and the entry_modulus metric:
    QSpecBench.multi_step_trotter_composition_discharged bundles the composition
    identity N·ε=1 (ε=1/5 the single-step entry-modulus bound) with the single-step
    entry discharge at dt=0.1, plus a universally-quantified triangle-inequality
    proxy on n identical nonnegative bounds. Declared finite N only; not an
    operator-norm / diamond process-distance Trotter composition theorem and not
    an unbounded step-count result (see trust_boundary.assumptions_not_checked).'
- id: haar_monte_carlo_integral
  status: passing
  notes: 'Checked under a hashed numerical certificate: haar_monte_carlo_cert.py
    samples 256 Haar qubit states (deterministic seed 20260725) and finds the
    sample-mean average gate fidelity of Pauli-X vs identity within the declared
    absolute tolerance 1/50 of the Nielsen closed form 1/3
    (output_sha256 04dc6e4f9e4b42779ed6461266555bee3ea3c8a8028b9a9d73e123a57dd1464c).
    QSpecBench.haar_monte_carlo_integral_contract records the matching declared
    contract parameters (samples, tolerance) and the Nielsen reference value at
    product-formula exactness. Numerical certificate + declared-parameter Lean
    anchor only — not a Lean / measure-theoretic proof of the Haar integral
    itself (see trust_boundary.assumptions_not_checked).'
