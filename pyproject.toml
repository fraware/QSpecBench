[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "qspecbench"
version = "0.2.0"
description = "Community-grade benchmark and evidence format for quantum formal verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mqt.qcec==3.6.0",
    "pyright>=1.1",
    "pre-commit>=3.0",
]
qec-matching = [
    "pymatching==2.4.0",
    "stim==1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mqt.qcec==3.6.0",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

[project.scripts]
qspecbench = "qspecbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/qspecbench"]

[tool.hatch.build.targets.wheel.sources]
"tools/qspecbench" = "qspecbench"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast trust/unit tests (no Lean toolchain, no stim)",
    "lean: Lean/lake-heavy evidence or elaborator tests",
    "stim: requires stim/pymatching (qec-matching extra)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["tools/qspecbench", "adapters", "scripts"]
exclude = ["**/Generated/**", "lean/**", ".cache/**"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["tools/qspecbench"]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_empty = true
